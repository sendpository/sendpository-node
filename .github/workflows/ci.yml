name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: nothing in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  # vitest 4 (needed for GHSA-82fw-gwwq-j7x9) depends on rolldown, which
  # imports `util.styleText` - absent on Node 18/20, so vitest itself cannot
  # start there. That's a test-runner limit, not a claim about the published
  # package: compat1 and compat2 keep verifying the built output runs on the
  # full `engines` range without asking vitest to launch on it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist

  compat:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Runtime deps only: the built package, not the dev/test toolchain
      # that just proved it needs Node 22.
      - run: npm ci --omit=dev
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dist
          path: dist
      - run: node --input-type=module -e "import { Sendpository } from './dist/index.js'; if (typeof Sendpository !== 'function') throw new Error('Sendpository export missing'); console.log('import ok on', process.version);"
      - run: node dist/cli.js --help

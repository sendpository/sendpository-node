name: Release

# Push a tag that matches package.json - `git tag v0.5.0 && git push origin v0.5.0`
# - and this publishes to npm with provenance.
#
# No npm token is stored anywhere: npm's trusted publishing accepts this
# workflow's GitHub identity (id-token) instead. On npmjs.com the package's
# Trusted Publisher is set to organisation `sendpository`, repository
# `sendpository-node`, workflow `release.yml`, environment `npm`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # The `npm` environment can require an approval before anything publishes.
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Only commits already on main are released. Defence in depth: the real
      # gate is the `npm` environment's required reviewers and a tag ruleset,
      # because whoever pushes a tag also controls this file at that commit.
      - name: Tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "Tag ${GITHUB_REF_NAME} points at a commit that is not on main"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json
        run: |
          test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}" \
            || { echo "Tag ${GITHUB_REF_NAME} does not match package.json"; exit 1; }
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      # Pinned: this job holds id-token, so the publishing tool must be reviewable.
      - run: npm install -g npm@11.5.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public

name: Release

# Push a tag that matches package.json - `git tag v0.5.0 && git push origin v0.5.0`
# - and this publishes to npm with provenance.
#
# No npm token is stored anywhere: npm's trusted publishing accepts this
# workflow's GitHub identity (id-token) instead. On npmjs.com the package's
# Trusted Publisher is set to organisation `sendpository`, repository
# `sendpository-node`, workflow `release.yml`, environment `npm`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # The `npm` environment can require an approval before anything publishes.
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json
        run: |
          test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}" \
            || { echo "Tag ${GITHUB_REF_NAME} does not match package.json"; exit 1; }
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
